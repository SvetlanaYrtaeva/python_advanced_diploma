services:
  db:
    image: postgres:15
    container_name: twitter_clone-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mydb}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: twitter_clone-web
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    volumes:
      - .:/app
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy

  tests:
    build: .
    container_name: twitter_clone-tests
    command: pytest
    volumes:
      - .:/app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TESTING: "1"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: